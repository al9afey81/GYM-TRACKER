const names=['Push – دفع','Legs – أرجل','Pull – سحب','راحة','Upper – علوي','Lower – سفلي','راحة'];
const types=['المشي بالمسبح','جهاز الدرج','المشي العادي','كارديو آخر'];
const rest=i=>i===3||i===6;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fresh=()=>({days:names.map(()=>null),extra:[]});
const storageKey='gymtracker-v1';
let state,storageOK=true;
try{state=JSON.parse(localStorage.getItem(storageKey))||{weeks:[fresh()]}}catch{state={weeks:[fresh()]};storageOK=false}
const app=document.getElementById('app');
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Older records were only approved after cardio completion; leave stored records intact.
const cardioDone=d=>d.cardio!==false;
function save(next){
  try{localStorage.setItem(storageKey,JSON.stringify(next))}
  catch{storageOK=false;app.querySelector('[role="status"]').textContent='تعذر الحفظ الدائم في هذا المتصفح.';alert('تعذر حفظ البيانات. لم يتم اعتماد العملية؛ حاول مجددًا.');return}
  const openWeeks=[...app.querySelectorAll('details.archive[open]')].map(el=>el.dataset.week);
  state=next;storageOK=true;render();
  openWeeks.forEach(index=>{const el=app.querySelector(`details.archive[data-week="${index}"]`);if(el)el.open=true});
}
function fields(d={}){
  return `<label>نوع الكارديو<select name="type">${types.map(t=>`<option${d.type===t?' selected':''}>${t}</option>`).join('')}</select></label><label>المدة بالدقائق <input name="minutes" type="number" min="1" max="600" value="${escapeHTML(d.minutes??45)}" required></label>`;
}
function stats(w){
  const count=w.days.filter(Boolean).length;
  return `<p>${count} / 7 أيام معتمدة</p><progress max="7" value="${count}"></progress><p>الحديد: ${w.days.filter(d=>d?.iron).length} / 5 | الكارديو: ${w.days.filter(d=>d&&cardioDone(d)).length} / 7 | الكارديو: ${[...w.days.filter(d=>d&&cardioDone(d)),...w.extra].reduce((s,d)=>s+Number(d.minutes),0)} دقيقة</p>`;
}
function dayMarkup(w,weekIndex,dayIndex){
  const d=w.days[dayIndex],editing=Boolean(d);
  return `<details class="day" data-week="${weekIndex}" data-day="${dayIndex}"><summary class="${editing?'done':''}">${editing?'<span>✓</span> <span aria-label="تعديل اليوم">✎</span>':'○'} اليوم ${dayIndex+1} — ${names[dayIndex]}</summary>${editing?`<small>${escapeHTML(d.date)} | ${escapeHTML(d.type)} · ${d.minutes} دقيقة | معتمد</small>`:''}<form class="day-form" data-week="${weekIndex}" data-day="${dayIndex}"><label>التاريخ<input type="date" name="date" value="${escapeHTML(d?.date??today())}" required></label>${rest(dayIndex)&&!editing?'<p>راحة من الحديد</p>':`<label><input type="checkbox" name="iron" ${d?.iron?'checked':''} ${!editing?'required':''}> تم تمرين الحديد</label>`}<label><input type="checkbox" name="cardio" ${editing&&cardioDone(d)?'checked':''} ${!editing?'required':''}> تم الكارديو</label>${fields(d||{})}<button>${editing?'حفظ التعديلات':'اعتماد اليوم ✓'}</button></form></details>`;
}
function render(){
  const n=state.weeks.length,w=state.weeks[n-1];
  app.innerHTML=`<section data-stats-week="${n-1}"><h3>الأسبوع ${n}</h3>${stats(w)}${names.map((_,j)=>dayMarkup(w,n-1,j)).join('')}</section><details><summary>كارديو إضافي دون تقديم الجدول</summary><form id="extra"><label>التاريخ<input type="date" name="date" value="${today()}" required></label>${fields()}<button>حفظ الكارديو</button></form>${w.extra.map(d=>`<p>${escapeHTML(d.date)} | ${escapeHTML(d.type)} — ${d.minutes} دقيقة</p>`).join('')}</details><section><h3>الأسابيع السابقة</h3>${state.weeks.slice(0,-1).map((v,j)=>`<details class="archive" data-week="${j}" data-stats-week="${j}"><summary class="done">✓ الأسبوع ${j+1} — مكتمل</summary>${stats(v)}${names.map((_,k)=>dayMarkup(v,j,k)).join('')}${v.extra.map(d=>`<p>كارديو إضافي: ${escapeHTML(d.date)} | ${escapeHTML(d.type)} — ${d.minutes} دقيقة</p>`).join('')}</details>`).reverse().join('')||'<p class="muted">لا توجد أسابيع مكتملة بعد</p>'}</section><p class="muted" role="status">${storageOK?'الحفظ محلي على هذا المتصفح فقط.':'تعذر الحفظ الدائم في هذا المتصفح.'}</p>`;
  app.querySelectorAll('details.day').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)app.querySelectorAll('details.day[open]').forEach(other=>{if(other!==el)other.open=false})}));
  app.querySelectorAll('.day-form').forEach(form=>form.onsubmit=e=>{
    e.preventDefault();
    const weekIndex=Number(form.dataset.week),dayIndex=Number(form.dataset.day),d=read(form),week=state.weeks[weekIndex];
    if(week.days.some((a,j)=>j!==dayIndex&&a?.date===d.date)){alert('تم اعتماد يوم تدريبي بهذا التاريخ مسبقًا');return}
    const next=JSON.parse(JSON.stringify(state));
    next.weeks[weekIndex].days[dayIndex]={...week.days[dayIndex],...d,iron:form.elements.iron?.checked??false,cardio:form.elements.cardio.checked};
    // Only the active week's first complete approval can create a successor.
    if(weekIndex===state.weeks.length-1&&!week.days.every(Boolean)&&next.weeks[weekIndex].days.every(Boolean))next.weeks.push(fresh());
    save(next);
  });
  document.getElementById('extra').onsubmit=e=>{e.preventDefault();const next=JSON.parse(JSON.stringify(state));next.weeks[n-1].extra.push(read(e.target));save(next)};
}
function read(form){const d=new FormData(form);return {date:d.get('date'),type:d.get('type'),minutes:Number(d.get('minutes'))}}
render();
</script></html>
